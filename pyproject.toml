[tool.ruff]
target-version = "py311"
line-length = 100
include = ["backend/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["backend"]
exclude = ["backend/tests/"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
